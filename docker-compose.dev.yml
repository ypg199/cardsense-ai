# Development overrides: auto-reload API and Vite dev server with live mounts.
services:
  api:
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app

  frontend:
    build:
      target: dev
    ports:
      - "3000:3000"
    environment:
      - VITE_PROXY_TARGET=http://api:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
