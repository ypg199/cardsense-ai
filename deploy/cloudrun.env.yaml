# Plain (non-secret) environment for the Cloud Run API service.
# MONGODB_URI and GEMINI_API_KEY come from Secret Manager (see cloudrun.sh).
MONGODB_DB_NAME: cardsense
ALLOWED_ORIGINS: https://card-sense.app,https://www.card-sense.app
# Cloudflare Pages preview builds (<hash>.cardsense.pages.dev)
ALLOWED_ORIGIN_REGEX: ^https://([a-z0-9-]+\.)?cardsense\.pages\.dev$
RATE_LIMIT_PER_HOUR: "20"
MAX_UPLOAD_MB: "10"
SESSION_TTL_HOURS: "24"
# Gemini chat model. New API keys can't use retired models (gemini-2.5-flash).
# On the 180-row eval statement 3.5-flash-lite matched 3.8-flash (100% found,
# 98.9% categories) in 27s vs 113s.
GEMINI_MODEL: gemini-3.5-flash-lite
